name: Build Android APK (WebView)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Cotonou Syndicat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run lint

      - name: Build web app and embed assets into Android WebView
        run: bash scripts/build-apk.sh --assets-only

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Package APK into contonougame/contonougame.apk
        run: |
          mkdir -p contonougame
          cp android/app/build/outputs/apk/debug/contonougame-debug.apk contonougame/contonougame.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: contonougame
          path: contonougame/contonougame.apk
          retention-days: 30

      - name: Publish Versioned APK Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: contonougame/contonougame.apk

      - name: Publish Latest APK Release (branch / manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cotonou Syndicat – Dernier APK
          body: "Build APK WebView automatique de Cotonou Syndicat (`contonougame.apk`) depuis `${{ github.ref_name }}` (`${{ github.sha }}`)."
          generate_release_notes: true
          make_latest: true
          files: contonougame/contonougame.apk
