# GitHub Actions workflow to build and deploy Cotonou Syndicat to GitHub Pages
name: Build & Deploy to GitHub Pages

on:
  # Trigger on pushes to the main or master branch
  push:
    branches:
      - main
      - master
  # Allow manual execution from the GitHub Actions tab
  workflow_dispatch:

# Set permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build application
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - name: Update SEO URLs for GitHub Pages
        run: |
          PAGES_URL="${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}"
          PAGES_URL="${PAGES_URL%/}"
          DEFAULT_URL="https://ais-pre-wdfxfb4v4l4bbpn2nfxkkw-137472231057.europe-west2.run.app"
          for file in contonougame/index.html contonougame/robots.txt contonougame/sitemap.xml contonougame/llms.txt; do
            if [ -f "$file" ]; then
              sed -i "s|$DEFAULT_URL|$PAGES_URL|g" "$file"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./contonougame

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
